name: crypto-refresh

# Keeps the pinned trader list current: harvests fresh candidate wallets,
# scores everyone currently pinned on their REAL P&L in this bot's own
# trade log, keeps whoever's net-positive untouched, and only swaps out a
# net-negative trader if a qualifying replacement is actually found.
#
# Runs weekly on its own (Sunday 03:00 UTC) and can also be fired by hand
# any time from the Actions tab.

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crypto-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Sync to latest (queued scheduled runs checkout a stale SHA)
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Harvest fresh candidate wallets (~30 min, listen-only)
        run: python3 -m crypto.harvest 30

      - name: Score current roster, replace net-negative traders only
        run: python3 -m crypto.refresh

      - name: Commit and push if the roster changed
        run: |
          git config user.name "crypto-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/crypto_traders.json
          git add crypto_candidates.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No change to the roster this run."
            exit 0
          fi
          git commit -m "crypto: weekly refresh -- keep winners, replace net-negative traders"
          BRANCH="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed"; exit 0
            fi
            echo "push rejected (bot committed meanwhile) -- rebasing, attempt $i"
            git fetch origin "$BRANCH"
            git rebase -X theirs "origin/$BRANCH"
            sleep 3
          done
          echo "could not push after 5 attempts"; exit 1
